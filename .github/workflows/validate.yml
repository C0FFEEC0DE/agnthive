name: Repository Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Opt every JavaScript action into Node.js 24 ahead of the September 2026
  # Node.js 20 runner deprecation (repo convention).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Pinned official Claude Code CLI for REQUIRED strict plugin validation
  # (plan task 01 / ADR 0012: reproducible harness contract). Floating `latest`
  # runs in the non-required `official-cli-canary` job below. Move this pin and
  # re-capture docs/compatibility.md in the same change.
  CLAUDE_CLI_PINNED_VERSION: '2.1.303'

jobs:
  repository-checks:
    name: Repository Checks (${{ matrix.os }} / Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Go is only needed to `go install` actionlint, which is installed on
      # Linux only (see below), so the Go toolchain is not set up elsewhere.
      - name: Set up Go
        if: runner.os == 'Linux'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # shellcheck is apt-get-installable only on Linux. actionlint is built
      # via `go install` (Linux only per task scope). On macOS, shellcheck is
      # preinstalled by the runner image; scripts/validate.mjs auto-detects
      # availability and runs it when present. On Windows, neither tool is
      # preinstalled and apt-get is unavailable, so validate.mjs SKIPs both.
      - name: "Install workflow lint tools (Linux: shellcheck + actionlint)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # `make` is preinstalled on Linux and macOS but not on Windows runners.
      # Install it via Chocolatey (preinstalled on Windows runners) so the
      # `make test` step below runs the same Node test suites everywhere.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make -y --no-progress

      - name: "Note: shellcheck/actionlint skipped on Windows"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "NOTE: shellcheck is not preinstalled on Windows runners and apt-get is unavailable; scripts/validate.mjs auto-detects availability and SKIPs shellcheck and actionlint on this OS. POSIX bash/jq/git steps below still run via git-bash."

      - name: Run repository validator
        shell: bash
        run: node scripts/validate.mjs

      - name: Run test suites (Node)
        shell: bash
        run: make test

      # Tier-2 strict plugin validation against the OFFICIAL Claude Code CLI
      # (`claude plugin validate --strict`), which fails on unrecognized manifest
      # fields, missing metadata, and other issues the runtime merely tolerates.
      # Required, not best-effort (plan task 01 / ADR 0012): a PINNED CLI version
      # is installed and the validation must run — a failed install is an
      # infrastructure failure (clear ::error below), never a silently skipped
      # check. Linux-only, matching the previous shard split.
      - name: Install pinned Claude Code CLI (Linux, required)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_PINNED_VERSION}"
          if ! command -v claude >/dev/null 2>&1; then
            echo "::error::pinned Claude Code CLI ${CLAUDE_CLI_PINNED_VERSION} failed to install (npm/network infrastructure failure); required official plugin validation cannot run"
            exit 1
          fi
          claude --version

      - name: "claude plugin validate --strict (Linux, pinned CLI: manifest + agents + skills)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          # The three strict targets plan task 14 repeats before release; no
          # skip branch — a missing/malformed CLI already failed above.
          claude plugin validate --strict plugins/agnthive
          claude plugin validate --strict plugins/agnthive/agents
          claude plugin validate --strict plugins/agnthive/skills

      # POSIX-only steps run under git-bash on Windows (present on Windows
      # runners via Git for Windows) so the jq/find/git invocations are
      # identical across all three operating systems. The hook runtime is now a
      # platform-independent Node plugin, so there are no shell scripts to
      # syntax-check.
      - name: Check key JSON files
        shell: bash
        run: |
          jq empty test/hooks/cases.json
          jq empty test/hooks/scenarios.json
          find bench/tasks -type f -name '*.json' -exec jq empty {} +
          jq empty bench/schema/*.json

      - name: Check whitespace errors
        shell: bash
        run: git diff --check

  # Non-required canary (plan task 01 / ADR 0012): the same strict checks
  # against floating `latest`. Drift here is an early warning that upstream
  # changed validation or schema behavior — it never replaces the pinned,
  # required validation in the matrix job above.
  official-cli-canary:
    name: Official CLI canary (floating latest, non-required)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Claude Code CLI (floating latest)
        shell: bash
        run: npm install -g @anthropic-ai/claude-code

      - name: "claude plugin validate --strict (latest: manifest + agents + skills)"
        shell: bash
        run: |
          claude --version
          set -e
          claude plugin validate --strict plugins/agnthive
          claude plugin validate --strict plugins/agnthive/agents
          claude plugin validate --strict plugins/agnthive/skills
