# Plugin installation + package smoke test.
#
# Runs the structural smoke validator (scripts/plugin-install-smoke.mjs) which
# PACKAGES the plugin into a clean temp dir and validates the packaged layout
# (manifest fields + shape contract, declared path resolution, no legacy
# .py/.sh runtime, hook exec form, statusline parse). This structural smoke is
# the ENFORCED gate and runs on every push to main and every PR targeting main.
#
# The official Claude Code CLI is now a REQUIRED part of this workflow
# (plan task 01 / ADR 0012): a PINNED version is installed and the packaged
# plugin is validated with `claude plugin validate --strict` (manifest,
# agents, skills) through the smoke script's --cli tier. A failed
# install/validation is an infrastructure failure — it can no longer be
# silently skipped. Floating `latest` runs in the non-required canary job
# below. The real `claude plugin` lifecycle commands (marketplace add,
# install, reload, list, update, uninstall) against a clean HOME stay
# ADVISORY: individual lifecycle hiccups are warnings, not gate failures.
name: Plugin Install Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Opt into Node.js 24 for JavaScript Actions ahead of the September 2026
# Node.js 20 runner deprecation (mirrors the benchmark workflows).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Pinned official Claude Code CLI for the required CLI tier of the smoke
  # script (plan task 01 / ADR 0012). Move this pin and re-capture
  # docs/compatibility.md in the same change.
  CLAUDE_CLI_PINNED_VERSION: '2.1.303'

permissions:
  contents: read

jobs:
  plugin-install-smoke:
    name: Plugin Install Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # REQUIRED — pinned official CLI install (plan task 01 / ADR 0012). The
      # CLI tier of the smoke script depends on it; a failed install must fail
      # the required check with a clear infrastructure message.
      - name: Install pinned Claude Code CLI (required)
        shell: bash
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_PINNED_VERSION}"
          if ! command -v claude >/dev/null 2>&1; then
            echo "::error::pinned Claude Code CLI ${CLAUDE_CLI_PINNED_VERSION} failed to install (npm/network infrastructure failure); plugin install smoke CLI tier cannot run"
            exit 1
          fi
          claude --version

      # ENFORCED GATE — structural smoke + official CLI strict tier. Packages
      # the plugin into a clean temp dir, validates the packaged layout, then
      # (`--cli`) runs `claude plugin validate --strict` against the PACKAGED
      # manifest/agents/skills. In CI a missing/malformed CLI fails the job
      # (not a skip); locally `--cli` degrades to a structural-only run with a
      # note, or hard-fails with `--require-cli`.
      - name: Structural + official-CLI smoke (pinned)
        shell: bash
        run: node scripts/plugin-install-smoke.mjs --cli --cli-version "${CLAUDE_CLI_PINNED_VERSION}"

      # ADVISORY — real claude CLI lifecycle. The `if:` on a GitHub Actions
      # step is an expression, not a shell command, so the command-existence
      # guard lives inside the bash script. continue-on-error keeps lifecycle
      # flakiness a warning: the enforced gates above are the pinned strict
      # validation and the structural smoke.
      - name: Claude CLI plugin lifecycle (advisory)
        shell: bash
        continue-on-error: true
        env:
          CLEAN_HOME: ${{ runner.temp }}/claude-clean-home
          PLUGIN_SOURCE: ${{ github.workspace }}/plugins/agnthive
        run: |
          set -uo pipefail
          if ! command -v claude >/dev/null 2>&1; then
            echo "claude CLI not installed on PATH; skipping lifecycle (advisory step; structural + strict tiers above are the enforced gates)"
            exit 0
          fi
          mkdir -p "$CLEAN_HOME"
          export HOME="$CLEAN_HOME"
          echo "::group::claude plugin lifecycle"
          echo "claude version: $(claude --version 2>&1 || echo unknown)"
          # Use the local marketplace add form so no network registry is required.
          if claude plugin marketplace add "$PLUGIN_SOURCE" 2>&1; then
            claude plugin install agnthive 2>&1 || echo "::warning::install step returned non-zero"
            claude plugin reload 2>&1 || echo "::warning::reload step returned non-zero"
            claude plugin list 2>&1 || echo "::warning::list step returned non-zero"
            claude plugin update agnthive 2>&1 || echo "::warning::update step returned non-zero"
            claude plugin uninstall agnthive 2>&1 || echo "::warning::uninstall step returned non-zero"
          else
            echo "::warning::marketplace add returned non-zero; CLI lifecycle skipped"
          fi
          echo "::endgroup::"

  # Non-required canary (plan task 01 / ADR 0012): run the smoke's CLI tier
  # against floating `latest`. Red here is an early warning of upstream
  # schema/validation drift; the pinned, required job above is the source of
  # truth.
  plugin-install-smoke-canary:
    name: Plugin install smoke canary (floating latest, non-required)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Claude Code CLI (floating latest)
        shell: bash
        run: npm install -g @anthropic-ai/claude-code

      - name: Structural + official-CLI smoke (latest)
        shell: bash
        run: node scripts/plugin-install-smoke.mjs --cli --require-cli

      - name: "claude plugin validate --strict (latest: manifest + agents + skills)"
        shell: bash
        run: |
          claude --version
          set -e
          claude plugin validate --strict plugins/agnthive
          claude plugin validate --strict plugins/agnthive/agents
          claude plugin validate --strict plugins/agnthive/skills